# Build KassenKnoten from this checkout instead of pulling the published image.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# `image` is overridden as well, so a local build never masquerades as the published
# version in `docker images` — telling the two apart matters the first time something
# behaves differently than the release does.
services:
  kassenknoten:
    build:
      context: .
    image: kassenknoten:local
