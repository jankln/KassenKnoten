# Typecheck, lint, format check and the full test suite — `npm run check`, on GitHub.
#
# Until this existed the suite ran only on the machine that made the commit, which is a
# promise rather than a gate: the receipt scanner shipped broken in three releases
# without a single red mark anywhere. Now a pull request cannot look green without it,
# and `image.yml` calls this workflow and builds nothing — not `edge`, not a release —
# until it has passed.
#
# Two jobs, side by side: the checks, and one end-to-end journey in a real browser against
# the standalone build — the same server the image runs. A caller of this workflow waits
# for both.
#
# One definition, two triggers. Pull requests run it directly; pushes to main and tags
# reach it through `image.yml`, so the checks are written down once and cannot drift
# between "what a PR must pass" and "what an image must pass".
name: Check

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The version the image runs (Dockerfile: node:22-bookworm-slim). A suite that only
      # passes on a newer Node than the one that ships proves less than it looks.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The standalone output is what the image ships, and what the receipt scanner once
      # worked everywhere but in. The test runs against it rather than `next dev`.
      - run: npm run build
        env:
          BUILD_STANDALONE: "1"

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # What the browser saw, for a failure that only happens on the runner.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
