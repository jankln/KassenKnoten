# Publish the landing page in `site/` to GitHub Pages.
#
# The images are not duplicated into `site/`: they live once in `docs/media/`, where the
# README also reads them from, and are copied in as the artifact is assembled. One copy of
# a screenshot is one screenshot that cannot go out of date on one of two paths.
#
# `enablement: true` switches Pages on and points it at Actions the first time this runs,
# so there is no click-through in the repository settings to remember or to document.
name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/media/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: cp -r docs/media site/media

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
