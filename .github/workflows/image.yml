# Publish the container image to the GitHub Container Registry.
#
# Built once per architecture on a native runner rather than once with QEMU: ARM runners
# are free for public repositories, and emulating an arm64 Next.js build costs half an
# hour per release for byte-identical output. Each runner then starts the image it built
# and runs the browser smoke test against it, so both architectures are used, not only
# compiled. The two builds are joined into a single manifest only after that, so
# `docker pull` picks the right one without anybody choosing a tag by hand.
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # Nothing is built from a commit or a tag that does not pass `npm run check`. Without
  # this, a tag pushed from a machine that skipped the suite would publish `latest`.
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      # A registry reference has to be lowercase and this repository is not
      # (jankln/KassenKnoten), so the name is derived rather than interpolated — which
      # also keeps the workflow correct in a fork with a different owner.
      - name: Name the image
        run: echo "IMAGE=${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - name: Name this architecture
        run: echo "ARCH=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only. The tags are decided once, by the merge job, from the single
      # manifest — an architecture that pushed a tag of its own would be a tag that means
      # "whichever runner finished last".
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=${{ env.ARCH }}

      # Start the image this runner just built — on its own architecture, amd64 here and
      # arm64 on the ARM runner — and use it the way a household would, before the
      # manifest that publishes it exists. The build stage already proves the standalone
      # output is complete; this proves the image around it starts, signs somebody in,
      # sets up a household, splits a cost and reads a receipt. The password hash and the
      # session secret come from the setup scripts inside the image, which tests those
      # too.
      - name: Start the image
        run: |
          ref="${REGISTRY}/${IMAGE}@${DIGEST}"
          docker pull "$ref"
          {
            printf '%s\n' "$E2E_PASSWORD" \
              | docker run -i --rm "$ref" node scripts/hash-password.ts \
              | grep '^LOCAL_PASSWORD_HASH='
            docker run --rm "$ref" node scripts/session-secret.ts
          } > /tmp/e2e.env
          test "$(wc -l < /tmp/e2e.env)" -eq 2
          docker run -d --name kassenknoten -p 127.0.0.1:3000:3000 --env-file /tmp/e2e.env "$ref"
          for attempt in $(seq 60); do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          docker logs kassenknoten
          exit 1
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          E2E_PASSWORD: image-smoke-test-password

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Use the image in a browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_PASSWORD: image-smoke-test-password

      - name: What the container said
        if: failure()
        run: docker logs kassenknoten || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: image-test-${{ env.ARCH }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.ARCH }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # A registry reference has to be lowercase and this repository is not
      # (jankln/KassenKnoten), so the name is derived rather than interpolated — which
      # also keeps the workflow correct in a fork with a different owner.
      - name: Name the image
        run: echo "IMAGE=${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows tags only. A push to main publishes `edge`, so pulling `latest`
      # never lands on whatever was merged an hour ago.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Join the architectures into one manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)

      - name: Show what was published
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${VERSION}"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
