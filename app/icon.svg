<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="KassenKnoten">
  <!-- The Knoten: two strands, one per person, genuinely interlaced. Same geometry as
       components/brand/knot-mark.tsx, with the member colours written out — a favicon is
       rendered without the stylesheet that defines the tokens. -->
  <defs>
    <mask id="over-top">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="20.51" r="5.6" fill="#000"/>
    </mask>
    <mask id="over-bottom">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="43.49" r="4.4" fill="#000"/>
    </mask>
  </defs>
  <circle cx="24" cy="32" r="14" fill="none" stroke="#008aa3" stroke-width="8"/>
  <circle cx="40" cy="32" r="14" fill="none" stroke="#b6498d" stroke-width="6" mask="url(#over-top)"/>
  <circle cx="24" cy="32" r="14" fill="none" stroke="#008aa3" stroke-width="8" mask="url(#over-bottom)"/>
</svg>
